<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise Reveal 🎁</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0f0f0f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .page {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            animation: fade .6s;
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 400px;
        }

        .active {
            display: flex;
        }

        @keyframes fade {
            from { opacity: 0; transform: scale(.9); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.5);
        }

        p {
            font-size: 18px;
            margin-bottom: 25px;
            color: #ddd;
        }

        input {
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 25px;
            border: 2px solid #ff4d6d;
            background: #1a1a1a;
            color: white;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
            width: 80%;
            box-shadow: 0 0 10px rgba(255, 77, 109, 0.2);
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            margin: 10px;
            cursor: pointer;
            background: #ff4d6d;
            color: white;
            transition: .3s;
            box-shadow: 0 5px 15px rgba(255,77,109,0.3);
            z-index: 20;
        }

        button:hover {
            transform: scale(1.05);
        }

        #gift {
            font-size: 120px;
            cursor: pointer;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            50% { transform: translateY(-20px); }
        }

        #no {
            position: relative;
            transition: 0.1s;
            z-index: 20;
        }

        .button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            position: relative;
            z-index: 20;
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 14px;
            margin-top: -5px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Background Music Element -->
    <audio id="bgMusic" src="song.mp3" loop></audio>

    <!-- Page 1 (Tap to Open) -->
    <div id="p1" class="page active">
        <div id="gift">🎁</div>
        <h1>Tap the Gift</h1>
    </div>

    <!-- Page 2 (Security Check - DOB Password) -->
    <div id="p2" class="page">
        <h1>Security Check 🔒</h1>
        <p>Tu saccha dost hai toh bata... Jiban ka Birthday (DOB) kab hai?</p>
        <input type="text" id="dobInput" placeholder="e.g. DDMMYYYY ya DD/MM/YYYY">
        <div id="errMsg" class="error-msg">❌ Galat Password! Dost hone pe shakk hai mujhe 😂</div>
        <button onclick="checkPassword()">Unlock Surprise 🔓</button>
    </div>

    <!-- Page 3 (Ready to Start) -->
    <div id="p3" class="page">
        <h1>Welcome Sakcham 😎</h1>
        <p>Identity Verified! Now ready for the surprise?</p>
        <button onclick="next(4)">Start Questions ➜</button>
    </div>

    <!-- Page 4 (Question Stage) -->
    <div id="p4" class="page">
        <h1 id="qTitle">Question 1 😂</h1>
        <p id="qText">Will you continue?</p>
        <div class="button-container">
            <button id="yesBtn">Yes 😎</button>
            <button id="no">No 😏</button>
        </div>
    </div>

    <!-- Page 5 (The FINAL REVEAL Page) -->
    <div id="p5" class="page">
        <div style="
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            background: #000;
            color: white;
            text-align: center;
            animation: fade .6s;
            padding: 20px;">
            
            <img src="photo.jpg" alt="Final Reveal" style="
                max-width: 100%;
                max-height: 80vh;
                border-radius: 20px;
                margin-top: 10px;
                box-shadow: 0 0 30px hotpink;
                border: 3px solid #ff4d6d;">
                
        </div>
    </div>

    <script>
        const gift = document.getElementById("gift");
        const audio = document.getElementById("bgMusic");

        // Gift Tap karte hi Audio Play hoga
        gift.onclick = () => { 
            audio.play().catch(e => console.log("Audio play allowed on user tap"));
            next(2); 
        }

        function next(n) {
            document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
            document.getElementById("p" + n).classList.add("active");
        }

        // PASSWORD CHECK LOGIC (Jiban's DOB: 29/10/2008)
        const correctDOBs = ["29102008", "29/10/2008", "29-10-2008", "29 10 2008"];

        function checkPassword() {
            const userInput = document.getElementById("dobInput").value.trim();
            const errMsg = document.getElementById("errMsg");

            if(correctDOBs.includes(userInput)) {
                errMsg.style.display = "none";
                next(3); // Correct password -> Go to Welcome Page
            } else {
                errMsg.style.display = "block";
                document.getElementById("dobInput").value = "";
            }
        }

        const questions = [
            "😂 Kya tu officially mera Best Friend hai?",
            "🍕 Kya tu mujhe lifetime treat dega?",
            "💰 Kya tu mujhe ₹1 Crore udhaar dega?",
            "🏍️ Kya apni bike mujhe dega?",
            "🤝 Kya meri bakwaas hamesha sunega?",
            "👶 Kya mere bachchon ka favourite chacha banega?",
            "❤️ Kya Jiban ❤️ Sakcham forever?"
        ];

        let current = 0;
        const yesBtn = document.getElementById("yesBtn");
        const qTitle = document.getElementById("qTitle");
        const qText = document.getElementById("qText");
        const noBtn = document.getElementById("no");

        yesBtn.onclick = function() {
            current++;

            if(current >= questions.length) {
                qTitle.innerHTML = "🎉 Congratulations";
                qText.innerHTML = "Bas ek last surprise baaki hai 😎";
                this.innerHTML = "Open Gift 🎁";
                noBtn.style.display = "none";

                this.onclick = function() {
                    next(5);
                }
                return;
            }

            qTitle.innerHTML = "Question " + (current + 1) + " 😂";
            qText.innerHTML = questions[current];
        }

        // No Button Runaway Logic
        noBtn.onmouseover = () => { moveNoButton(); }
        noBtn.ontouchstart = (e) => { e.preventDefault(); moveNoButton(); }

        function moveNoButton() {
            noBtn.style.position = "absolute";
            const maxX = window.innerWidth - noBtn.clientWidth - 40;
            const maxY = window.innerHeight - noBtn.clientHeight - 40;
            noBtn.style.left = Math.max(20, Math.random() * maxX) + "px";
            noBtn.style.top = Math.max(20, Math.random() * maxY) + "px";
        }

        noBtn.onclick = function() {
            alert("❌ No Allowed 😂 Chup chap Yes daba!");
        }
    </script>
</body>
</html>
