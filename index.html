<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise Reveal 🎁</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0f0f0f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .page {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            animation: fade .6s;
        }

        .active {
            display: flex;
        }

        @keyframes fade {
            from { opacity: 0; transform: scale(.9); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.5);
        }

        p {
            font-size: 20px;
            margin-bottom: 25px;
            color: #ddd;
        }

        button {
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            margin: 10px;
            cursor: pointer;
            background: #ff4d6d;
            color: white;
            transition: .3s;
            box-shadow: 0 5px 15px rgba(255,77,109,0.3);
            z-index: 10;
        }

        button:hover {
            transform: scale(1.1);
        }

        #gift {
            font-size: 120px;
            cursor: pointer;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            50% { transform: translateY(-20px); }
        }

        #no {
            position: relative;
            transition: 0.1s;
        }

        .button-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>
<body>

    <!-- Page 1 (Tap to Open) -->
    <div id="p1" class="page active">
        <div id="gift">🎁</div>
        <h1>Tap the Gift</h1>
    </div>

    <!-- Page 2 (Ready to Start) -->
    <div id="p2" class="page">
        <h1>Welcome Sakcham 😎</h1>
        <p>Ready for the biggest surprise?</p>
        <button onclick="next(3)">Next ➜</button>
    </div>

    <!-- Page 3 (Question Stage) -->
    <div id="p3" class="page">
        <h1 id="qTitle">Question 1 😂</h1>
        <p id="qText">Will you continue?</p>
        <div class="button-container">
            <button id="yesBtn">Yes 😎</button>
            <button id="no">No 😏</button>
        </div>
    </div>

    <!-- The FINAL REVEAL Page -->
    <div id="p4" class="page">
        <div style="
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            background: #000;
            color: white;
            text-align: center;
            animation: fade .6s;
            padding: 20px;">
            
            <img src="photo.jpg" alt="Final Reveal" style="
                max-width: 100%;
                max-height: 80vh;
                border-radius: 20px;
                margin-top: 10px;
                box-shadow: 0 0 30px hotpink;
                border: 3px solid #ff4d6d;">
                
            <!-- If you want to add confetti over the image via Javascript, you can integrate that here too. -->
        </div>
    </div>

    <script>
        // Move to Next Page
        const gift = document.getElementById("gift");
        gift.onclick = () => { next(2); }

        function next(n) {
            document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
            document.getElementById("p" + n).classList.add("active");
        }

        // Questions Logic
        const questions = [
            "😂 Kya tu officially mera Best Friend hai?",
            "🍕 Kya tu mujhe lifetime treat dega?",
            "💰 Kya tu mujhe ₹1 Crore udhaar dega?",
            "🏍️ Kya apni bike mujhe dega?",
            "🤝 Kya meri bakwaas hamesha sunega?",
            "👶 Kya mere bachchon ka favourite chacha banega?",
            "❤️ Kya Jiban ❤️ Sakcham forever?"
        ];

        let current = 0;
        const yesBtn = document.getElementById("yesBtn");
        const qTitle = document.getElementById("qTitle");
        const qText = document.getElementById("qText");
        const noBtn = document.getElementById("no");

        yesBtn.onclick = function() {
            current++;

            if(current >= questions.length) {
                // Pre-Final step to setup for image reveal
                qTitle.innerHTML = "🎉 Congratulations";
                qText.innerHTML = "Bas ek last surprise baaki hai 😎";
                this.innerHTML = "Open Gift 🎁";
                noBtn.style.display = "none";

                // Final Reveal Page (show the image)
                this.onclick = function() {
                    next(4);
                }
                return;
            }

            // Load next question
            qTitle.innerHTML = "Question " + (current + 1) + " 😂";
            qText.innerHTML = questions[current];
        }

        // No Button Runaway Logic
        noBtn.onmouseover = () => {
            noBtn.style.position = "absolute";
            const maxX = window.innerWidth - noBtn.clientWidth - 20;
            const maxY = window.innerHeight - noBtn.clientHeight - 20;
            noBtn.style.left = Math.random() * maxX + "px";
            noBtn.style.top = Math.random() * maxY + "px";
        }

        // No Button Prank Logic (agar click ho gaya)
        noBtn.onclick = function() {
            for(let i = 0; i < 40; i++) {
                let b = document.createElement("button");
                b.innerHTML = "NO 😂";
                b.style.position = "absolute";
                b.style.left = Math.random() * (window.innerWidth - 100) + "px";
                b.style.top = Math.random() * (window.innerHeight - 50) + "px";
                b.style.pointerEvents = "none"; 
                document.body.appendChild(b);
            }
            alert("❌ No Allowed 😂 Chup chap Yes daba!");
        }
    </script>
</body>
</html>
